<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSP Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF7F0; --ink:#132433; --ink-soft:#4A5A67; --navy:#0F2A3D; --navy-2:#1B4258;
    --gold:#E2A63B; --gold-deep:#C9862A; --line:rgba(19,36,51,0.12);
    --display:'Space Grotesk', sans-serif; --body:'Public Sans', sans-serif; --mono:'JetBrains Mono', monospace;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:var(--body); background:var(--bg); color:var(--ink); min-height:100vh; }
  .wrap{ max-width:960px; margin:0 auto; padding:50px 24px 100px; }
  h1{ font-family:var(--display); font-size:28px; color:var(--navy); margin-bottom:6px; }
  .sub{ color:var(--ink-soft); font-size:14.5px; margin-bottom:30px; }

  /* Login gate */
  #loginGate{ max-width:380px; margin:80px auto; background:#fff; border:1px solid var(--line); padding:40px; text-align:center; }
  #loginGate h2{ font-family:var(--display); font-size:20px; color:var(--navy); margin-bottom:20px; }
  #loginGate input{ width:100%; padding:12px 14px; border:1px solid var(--line); font-size:15px; margin-bottom:14px; }
  #loginGate button{ width:100%; padding:12px; background:var(--gold); color:var(--navy); font-weight:700; border:none; cursor:pointer; font-size:14.5px; }
  #loginGate button:hover{ background:var(--gold-deep); }
  #loginError{ color:#C0392B; font-size:13.5px; margin-top:10px; display:none; }

  #dashboard{ display:none; }

  /* Section switcher (Testimonials / Leads) */
  .section-switch{ display:flex; gap:10px; margin-bottom:34px; }
  .section-btn{
    padding:11px 20px; font-size:13.5px; font-weight:700; color:var(--ink-soft);
    background:#fff; border:1px solid var(--line); cursor:pointer; border-radius:30px;
  }
  .section-btn.active{ background:var(--navy); color:#fff; border-color:var(--navy); }
  .section-view{ display:none; }
  .section-view.active{ display:block; }

  .tabs{ display:flex; gap:8px; margin-bottom:28px; border-bottom:1px solid var(--line); }
  .tab{ padding:10px 18px; font-size:13.5px; font-weight:600; color:var(--ink-soft); cursor:pointer; border-bottom:2px solid transparent; }
  .tab.active{ color:var(--navy); border-color:var(--gold); }

  .card{ background:#fff; border:1px solid var(--line); padding:22px 24px; margin-bottom:14px; }
  .card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:14px; flex-wrap:wrap; }
  .card-name{ font-family:var(--display); font-weight:600; font-size:16px; color:var(--navy); }
  .card-meta{ font-size:13px; color:var(--ink-soft); margin-top:2px; }
  .card-stars{ color:var(--gold-deep); font-size:14px; letter-spacing:1px; }
  .card-msg{ font-size:14.5px; color:var(--ink-soft); margin-top:12px; line-height:1.6; }
  .card-actions{ display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }
  .btn{ padding:9px 16px; font-size:13px; font-weight:700; border:none; cursor:pointer; }
  .btn-approve{ background:var(--navy); color:#fff; }
  .btn-approve:hover{ background:var(--navy-2); }
  .btn-reject{ background:transparent; color:#C0392B; border:1px solid #C0392B; }
  .btn-reject:hover{ background:#C0392B; color:#fff; }
  .btn-contacted{ background:#2E6B8A; color:#fff; }
  .btn-close{ background:transparent; color:var(--ink-soft); border:1px solid var(--line); }
  .btn-delete{ background:transparent; color:var(--ink-soft); border:1px solid var(--line); }
  .status-badge{ font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:0.06em; padding:4px 9px; border-radius:20px; }
  .status-pending, .status-new{ background:#FFF3D6; color:#9A6A0C; }
  .status-approved, .status-contacted{ background:#E1F3E5; color:#1F7A3C; }
  .status-rejected{ background:#FBE3E1; color:#B23A2E; }
  .status-closed{ background:#E7E7E7; color:#555; }
  .empty{ text-align:center; padding:60px 0; color:var(--ink-soft); font-size:14.5px; }
  .lead-contact{ font-size:13.5px; color:var(--ink-soft); margin-top:6px; }
  .lead-contact a{ color:var(--navy-2); text-decoration:underline; }
</style>
</head>
<body>

<div id="loginGate">
  <h2>PSP Admin Login</h2>
  <input type="password" id="passwordInput" placeholder="Enter admin password">
  <button id="loginBtn">Login</button>
  <p id="loginError">Incorrect password. Please try again.</p>
</div>

<div id="dashboard" class="wrap">
  <h1 id="pageTitle">Admin Dashboard</h1>
  <p class="sub" id="pageSub">Manage testimonials and consultation requests from your website.</p>

  <div class="section-switch">
    <button class="section-btn active" data-section="leads">Consultation Requests</button>
    <button class="section-btn" data-section="testimonials">Testimonials</button>
  </div>

  <!-- LEADS SECTION -->
  <div class="section-view active" id="leadsSection">
    <div class="tabs">
      <div class="tab active" data-leadtab="new">New</div>
      <div class="tab" data-leadtab="contacted">Contacted</div>
      <div class="tab" data-leadtab="closed">Closed</div>
    </div>
    <div id="leadList"></div>
  </div>

  <!-- TESTIMONIALS SECTION -->
  <div class="section-view" id="testimonialsSection">
    <div class="tabs">
      <div class="tab active" data-testitab="pending">Pending</div>
      <div class="tab" data-testitab="approved">Approved</div>
      <div class="tab" data-testitab="rejected">Rejected</div>
    </div>
    <div id="testiList"></div>
  </div>
</div>

<script>
  let adminPassword = '';
  let allTestimonials = [];
  let allLeads = [];
  let activeTestiTab = 'pending';
  let activeLeadTab = 'new';
  let activeSection = 'leads';

  const loginGate = document.getElementById('loginGate');
  const dashboard = document.getElementById('dashboard');
  const loginError = document.getElementById('loginError');

  document.getElementById('loginBtn').addEventListener('click', attemptLogin);
  document.getElementById('passwordInput').addEventListener('keydown', (e)=>{ if(e.key === 'Enter') attemptLogin(); });

  async function attemptLogin(){
    const pw = document.getElementById('passwordInput').value;
    const res = await fetch('/api/admin/leads', { headers: { 'x-admin-password': pw } });
    if(res.status === 401){
      loginError.style.display = 'block';
      return;
    }
    adminPassword = pw;
    loginGate.style.display = 'none';
    dashboard.style.display = 'block';
    loadLeads();
    loadTestimonials();
  }

  // ---------- section switcher ----------
  document.querySelectorAll('.section-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.section-btn').forEach(b=> b.classList.remove('active'));
      btn.classList.add('active');
      activeSection = btn.dataset.section;
      document.getElementById('leadsSection').classList.toggle('active', activeSection === 'leads');
      document.getElementById('testimonialsSection').classList.toggle('active', activeSection === 'testimonials');
    });
  });

  // ---------- leads ----------
  document.querySelectorAll('[data-leadtab]').forEach(tab=>{
    tab.addEventListener('click', ()=>{
      document.querySelectorAll('[data-leadtab]').forEach(t=> t.classList.remove('active'));
      tab.classList.add('active');
      activeLeadTab = tab.dataset.leadtab;
      renderLeads();
    });
  });

  async function loadLeads(){
    const res = await fetch('/api/admin/leads', { headers: { 'x-admin-password': adminPassword } });
    allLeads = await res.json();
    renderLeads();
  }

  function renderLeads(){
    const list = document.getElementById('leadList');
    const filtered = allLeads.filter(l => l.status === activeLeadTab);
    if(filtered.length === 0){
      list.innerHTML = `<div class="empty">No ${activeLeadTab} requests.</div>`;
      return;
    }
    list.innerHTML = filtered.map(l => `
      <div class="card">
        <div class="card-top">
          <div>
            <div class="card-name">${escapeHTML(l.name)}</div>
            <div class="card-meta">${escapeHTML(l.city || '—')} · ${new Date(l.createdAt).toLocaleString()}</div>
            <div class="lead-contact">
              📞 <a href="tel:${escapeHTML(l.phone)}">${escapeHTML(l.phone)}</a>
              &nbsp;·&nbsp;
              💬 <a href="https://wa.me/91${escapeHTML(l.phone.replace(/\\D/g,'').slice(-10))}" target="_blank">WhatsApp</a>
              ${l.email ? `&nbsp;·&nbsp;✉️ ${escapeHTML(l.email)}` : ''}
            </div>
          </div>
          <span class="status-badge status-${l.status}">${l.status}</span>
        </div>
        ${l.service ? `<div class="card-msg"><strong>Service:</strong> ${escapeHTML(l.service)}</div>` : ''}
        ${l.message ? `<div class="card-msg">"${escapeHTML(l.message)}"</div>` : ''}
        <div class="card-actions">
          ${l.status !== 'contacted' ? `<button class="btn btn-contacted" onclick="updateLeadStatus('${l.id}','contacted')">Mark Contacted</button>` : ''}
          ${l.status !== 'closed' ? `<button class="btn btn-close" onclick="updateLeadStatus('${l.id}','closed')">Close</button>` : ''}
          ${l.status !== 'new' ? `<button class="btn btn-close" onclick="updateLeadStatus('${l.id}','new')">Reopen</button>` : ''}
          <button class="btn btn-delete" onclick="deleteLead('${l.id}')">Delete</button>
        </div>
      </div>
    `).join('');
  }

  async function updateLeadStatus(id, status){
    await fetch(`/api/admin/leads/${id}/status`, {
      method: 'POST',
      headers: { 'x-admin-password': adminPassword, 'Content-Type': 'application/json' },
      body: JSON.stringify({ status })
    });
    loadLeads();
  }

  async function deleteLead(id){
    if(!confirm('Permanently delete this request?')) return;
    await fetch(`/api/admin/leads/${id}`, {
      method: 'DELETE',
      headers: { 'x-admin-password': adminPassword }
    });
    loadLeads();
  }

  // ---------- testimonials ----------
  document.querySelectorAll('[data-testitab]').forEach(tab=>{
    tab.addEventListener('click', ()=>{
      document.querySelectorAll('[data-testitab]').forEach(t=> t.classList.remove('active'));
      tab.classList.add('active');
      activeTestiTab = tab.dataset.testitab;
      renderTestimonials();
    });
  });

  async function loadTestimonials(){
    const res = await fetch('/api/admin/testimonials', { headers: { 'x-admin-password': adminPassword } });
    allTestimonials = await res.json();
    renderTestimonials();
  }

  function renderTestimonials(){
    const list = document.getElementById('testiList');
    const filtered = allTestimonials.filter(t => t.status === activeTestiTab);
    if(filtered.length === 0){
      list.innerHTML = `<div class="empty">No ${activeTestiTab} testimonials.</div>`;
      return;
    }
    list.innerHTML = filtered.map(t => `
      <div class="card">
        <div class="card-top">
          <div>
            <div class="card-name">${escapeHTML(t.name)}</div>
            <div class="card-meta">${escapeHTML(t.city || '—')} · ${new Date(t.createdAt).toLocaleDateString()}</div>
          </div>
          <div style="text-align:right;">
            <div class="card-stars">${'★'.repeat(t.rating || 0)}${'☆'.repeat(5 - (t.rating || 0))}</div>
            <span class="status-badge status-${t.status}">${t.status}</span>
          </div>
        </div>
        <div class="card-msg">"${escapeHTML(t.message)}"</div>
        <div class="card-actions">
          ${t.status !== 'approved' ? `<button class="btn btn-approve" onclick="updateTestiStatus('${t.id}','approve')">Approve</button>` : ''}
          ${t.status !== 'rejected' ? `<button class="btn btn-reject" onclick="updateTestiStatus('${t.id}','reject')">Reject</button>` : ''}
          <button class="btn btn-delete" onclick="deleteTestimonial('${t.id}')">Delete</button>
        </div>
      </div>
    `).join('');
  }

  async function updateTestiStatus(id, action){
    await fetch(`/api/admin/testimonials/${id}/${action}`, {
      method: 'POST',
      headers: { 'x-admin-password': adminPassword }
    });
    loadTestimonials();
  }

  async function deleteTestimonial(id){
    if(!confirm('Permanently delete this testimonial?')) return;
    await fetch(`/api/admin/testimonials/${id}`, {
      method: 'DELETE',
      headers: { 'x-admin-password': adminPassword }
    });
    loadTestimonials();
  }

  function escapeHTML(str){
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }
</script>
</body>
</html>
